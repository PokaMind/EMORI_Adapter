# systemd drop-in: while v2 owns the serial bus, Pollen's daemon must not start.
#
# Not from `systemctl start`, not from a boot, and not from `Wants=reachy-mini-daemon` in
# emori-camera-bridge.service -- which is the one nobody sees coming. Two processes on
# /dev/ttyAMA3 is not a degraded robot; it is a robot where the motors belong to whichever one
# won the race, and it looks perfectly healthy from outside.
#
# WHY A CONDITION AND NOT `systemctl mask`: masking replaces
# /etc/systemd/system/reachy-mini-daemon.service with a symlink to /dev/null, and on the
# stock robot image that path is a REAL FILE:
#
#     Failed to mask unit: File '/etc/systemd/system/reachy-mini-daemon.service'
#     already exists
#
# `systemctl disable` does not close it either: `Wants=` starts a disabled unit happily.
# A failed Condition is not a failed start -- the unit is skipped, the dependency is
# satisfied, the bridge comes up, and nothing opens the serial port.
#
# Install (from /opt/emori):
#   sudo mkdir -p /etc/systemd/system/reachy-mini-daemon.service.d
#   sudo cp deploy/robot/ros2_native/reachy-mini-daemon-v2-fence.conf \
#        /etc/systemd/system/reachy-mini-daemon.service.d/zz-v2-fence.conf
#   sudo systemctl daemon-reload
#
# The fence is the FLAG FILE, so raising and lowering it needs no systemd knowledge and
# leaves a trace in `ls`:
#   sudo touch /opt/emori/V2_OWNS_THE_BUS     # v2 owns the bus; the daemon cannot start
#   sudo rm -f /opt/emori/V2_OWNS_THE_BUS     # handed back; v1 can run again
#
# Verify the fence holds:
#   sudo systemctl start reachy-mini-daemon
#   systemctl status reachy-mini-daemon | grep -i condition   # "Condition check resulted in ..."
#   curl -s localhost:8000/api/daemon/status | grep -o reachy_mini_ros2   # still the shim
[Unit]
ConditionPathExists=!/opt/emori/V2_OWNS_THE_BUS
