# systemd drop-in: while the hub is the host application, the hostapp must not start.
#
# Not from `systemctl start`, not from a boot, and not from the kiosk's Wants= on it.
# Two programs on :8090 is not a degraded robot: whichever lost the race exits, and the
# robot shows nothing until someone looks.
#
# The hub's unit carries the opposite Condition, and neither unit Conflicts= with the other.
# With both enabled, exactly one Condition holds. A failed Condition is a skipped start, not
# a failed one and not a stop of the other unit, so the kiosk's dependency on both is still
# satisfied. A Conflicts= would have a start of one stop the other even when its own start
# was skipped, and a rollback would boot to a robot with no program on the port.
#
# The fence is the FLAG FILE, so raising and lowering it needs no systemd knowledge and
# leaves a trace in `ls`. deploy/robot/hub-stack.sh does both:
#   sudo touch /opt/emori/HUB_IS_ROS     # the hub is the host application
#   sudo rm -f /opt/emori/HUB_IS_ROS     # handed back to the hostapp
#
# Install (hub-stack.sh apply ros does this):
#   sudo mkdir -p /etc/systemd/system/emori-hostapp.service.d
#   sudo cp deploy/robot/emori-hostapp-hub-fence.conf \
#        /etc/systemd/system/emori-hostapp.service.d/zz-hub-fence.conf
#   sudo systemctl daemon-reload
#
# Verify the fence holds, with the flag raised:
#   sudo systemctl start emori-hostapp
#   systemctl status emori-hostapp | grep -i condition   # "Condition check resulted in ..."
[Unit]
ConditionPathExists=!/opt/emori/HUB_IS_ROS
