# systemd drop-in: force the OS-image reachy-mini-daemon to run --no-media on every
# boot, via an EMORI launcher that mirrors the image launcher.sh environment.
#
# WHY a launcher and not `ExecStart=<binary> --no-media`: on ReachyMiniOS v0.2.3 the
# unit's ExecStart is .../wireless/launcher.sh (it sets GStreamer/libcamera env,
# MALLOC_ARENA_MAX, rfkill) and then runs `python -m reachy_mini.daemon.app.main`.
# There is NO /usr/bin/reachy-mini-daemon binary on the image (only a console-script
# inside /venvs/mini_daemon). Pointing ExecStart at that nonexistent path leaves the
# daemon dead on boot, so we replace ExecStart with our env-matched mirror launcher.
#
# Install (from /opt/emori):
#   chmod +x deploy/robot/emori-daemon-launcher.sh
#   sudo mkdir -p /etc/systemd/system/reachy-mini-daemon.service.d
#   sudo cp deploy/robot/reachy-mini-daemon-override.conf \
#        /etc/systemd/system/reachy-mini-daemon.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart reachy-mini-daemon
#
# VERIFY FIRST on every OS update: `systemctl cat reachy-mini-daemon` and re-diff the
# image launcher.sh env against emori-daemon-launcher.sh before trusting this drop-in.
# VERIFY AFTER: curl -s localhost:8000/api/daemon/status -> state:running, no_media:true
[Service]
ExecStart=
ExecStart=/opt/emori/deploy/robot/emori-daemon-launcher.sh
