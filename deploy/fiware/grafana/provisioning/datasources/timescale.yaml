apiVersion: 1
datasources:
  - name: EMORI-TimescaleDB
    type: postgres
    access: proxy
    url: timescale:5432
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      database: quantumleap
      sslmode: disable
      postgresVersion: 1400
      timescaledb: true
    isDefault: true
    editable: true
# QuantumLeap stores one table per entity type per tenant in schema "mt<tenant>"
# (e.g. schema mtpokamind, table etsession). Query engagementlevel / escalation /
# rapport / attention over time_index for the trainer dashboard.
