[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emori-adapter"
version = "0.1.0"
description = "EMORI: on-robot hub, ROS 2 / ROS4HRI stack and deploy kit for the Pollen Robotics Reachy Mini; connects to the Pokamind service with a per-robot token."
readme = "README.md"
# <3.14: the CM4 robot OS (Debian Trixie) ships Python 3.13 — the adapter must
# install there. The MuJoCo sim extra still needs 3.12 on Windows (mujoco wheel).
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Pokamind AB" }]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Reachy Mini SDK + MuJoCo simulator (Windows-side, Python 3.12). Pinned by the SDK to mujoco==3.3.0.
sim = ["reachy-mini[mujoco]>=1.8"]
# Live Pokamind source: the /ws/relay WebSocket client (emori-run --source pokamind,
# the ROS 2 live publisher).
pokamind = ["websockets>=12.0"]
# Robot-side kiosk host app (launcher + SSO + the live-session hub).
# wsproto gives uvicorn a reliable WebSocket backend for /ws/relay.
# PyJWT + cryptography sign THIS robot's per-robot Pokamind token (robot_token.py,
# EdDSA).
# segno draws the People tab's QR badges (hostapp/badges.py): pure Python, no
# dependencies, offline. install.sh step 2 installs this extra on every FULL deploy.
hostapp = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "wsproto>=1.2",
    "PyJWT>=2.9,<3",
    "cryptography>=42,<46",
    "segno>=1.5,<2",
]
# Server-side robot voice (Piper, free/offline, ARM-OK on the CM4).
speech = ["piper-tts>=1.2"]
# Server-side robot ears (Vosk offline STT for the verbal topic menu).
stt = ["vosk>=0.3.45"]
# PyJWT is also here (not only `hostapp`) because CI collects the pure
# control-contract tests with `.[dev,hostapp,pokamind]`.
dev = [
    "pytest>=8.0",
    "ruff>=0.15,<0.16",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.21,<1",
    "PyJWT>=2.9,<3",
    # The gaze and head-pose math of reachy_mini_ros2, tested without a ROS install.
    "scipy>=1.11",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.8",
    "pillow",
    "setuptools",
]

[project.scripts]
emori-run = "emori_adapter.cli:main"
emori-session = "emori_adapter.session:main"
emori-hostapp = "emori_adapter.hostapp.server:main"
emori-readycheck = "emori_adapter.hostapp.readycheck:main"
emori-admin = "emori_adapter.admin.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# daemon_routes.json: the :8000 routes readycheck's daemon_routes gate asks the robot for
# (generated by tests/test_daemon_contract.py --write-manifest).
emori_adapter = ["py.typed", "hostapp/daemon_routes.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `import scripts.x` works from a bare `pytest`, not only `python -m pytest`.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
